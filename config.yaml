# ==============================================================================
# YarnBall SFT Training Configuration for Qwen2.5-7B-Instruct
# ==============================================================================

model:
  base_model_name: "Qwen/Qwen2.5-7B-Instruct"
  attn_implementation: "flash_attention_2"  # Falls back to sdpa if unavailable
  torch_dtype: "bfloat16"

dataset:
  repo_id: "CamiloEmiliano/yarnball-sft"
  split_train: "train"
  split_val: "validation"
  split_test: "test"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./outputs/yarnball-qwen-7b-lora"
  hub_model_id: "CamiloEmiliano/yarnball-qwen-7b-lora"
  push_to_hub: true
  hub_private_repo: true
  
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_seq_length: 2048
  
  bf16: true
  fp16: false
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 2
  report_to: "none" # Set to "wandb" if using Weights & Biases
